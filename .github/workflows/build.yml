name: Build

# Every push and pull request is type-checked, tested and built into an installer.
# Pushing a tag like v0.2.0 also attaches that installer to a draft release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The official LGPL build of libmpv. Changing the version means changing all three.
  MPV_VERSION: v0.42.0
  MPV_ARCHIVE: libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip
  MPV_SHA256: 8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch libmpv
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP $env:MPV_ARCHIVE
          Invoke-WebRequest "https://github.com/mpv-player/mpv/releases/download/$env:MPV_VERSION/$env:MPV_ARCHIVE" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv archive checksum is $hash, expected $env:MPV_SHA256" }
          $out = Join-Path $env:RUNNER_TEMP libmpv
          Expand-Archive $zip -DestinationPath $out
          $dll = Get-ChildItem $out -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll is not in the archive" }
          Copy-Item $dll.FullName vendor/libmpv/libmpv-2.dll

      # The archive ships a MinGW import library; MSVC needs its own, made from mpv.def.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Make the MSVC import library
        working-directory: vendor/libmpv
        run: lib /def:mpv.def /machine:x64 /out:mpv.lib

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check the interface
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Tee-Object -FilePath src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      # A draft, so a person reads the notes and publishes it. An existing release for the tag is left as it is.
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; not touching it."
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Marquee ${TAG#v}"
          fi
